<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Job For Jobless Myanmar">
  <defs>
    <radialGradient id="orb" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="28%" stop-color="#2a7dff"/>
      <stop offset="62%" stop-color="#1256e0"/>
      <stop offset="100%" stop-color="#062a86"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c36a"/>
      <stop offset="50%" stop-color="#3ee6ff"/>
      <stop offset="100%" stop-color="#d48bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="256" cy="256" rx="228" ry="214" fill="none" stroke="url(#ringA)" stroke-width="6" opacity=".85" transform="rotate(-18 256 256)"/>
  <ellipse cx="256" cy="256" rx="214" ry="228" fill="none" stroke="#3ee6ff" stroke-width="3" opacity=".45" transform="rotate(22 256 256)"/>

  <circle cx="256" cy="256" r="168" fill="url(#orb)" stroke="#9ad8ff" stroke-width="3"/>
  <circle cx="256" cy="256" r="168" fill="url(#shine)"/>
  <path d="M118 168 A168 168 0 0 1 372 128" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".22"/>

  <g transform="translate(256 168)" fill="#fff">
    <rect x="-36" y="8" width="40" height="40" rx="3"/>
    <path d="M-8 36 L36 -20 H16 L48 -48 L80 -20 H60 L14 36 Z"/>
  </g>

  <g fill="#fff" font-family="Sora, Arial Black, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="248" font-size="36" letter-spacing="1">JOB FOR</text>
    <text x="256" y="286" font-size="36" letter-spacing="1">JOBLESS</text>
    <text x="256" y="324" font-size="30" letter-spacing="2">MYANMAR</text>
  </g>

  <g transform="translate(372 352)">
    <polygon fill="#3ee6ff" points="0,-28 8,-24 16,-28 20,-20 28,-16 24,-8 28,0 20,4 16,12 8,8 0,12 -8,8 -16,12 -20,4 -28,0 -24,-8 -28,-16 -20,-20 -16,-28 -8,-24"/>
    <path d="M-10 0 L-3 8 L12 -10" fill="none" stroke="#06324a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
